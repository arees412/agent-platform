# Reduced Docker Compose profile without Obscura, OpenTelemetry, or the frontend.
# Unlike docker-compose.yaml, this profile contains only the services and
# Qdrant, MongoDB, and Redis; it omits observability and browser components.
# Usage: docker compose -f docker/docker-compose.simple.yaml up -d

services:
  # Gateway service - API gateway
  gateway:
    build:
      context: ..
      dockerfile: services/gateway/Dockerfile
    ports:
      - "9000:9000"
    volumes:
      - ../services/gateway/config.yaml:/app/config.yaml:ro
    depends_on:
      - chat-service
      - knowledge-service
      - memory-service
      - mcp-service
      - agent-service
    networks:
      - agent-network
    restart: unless-stopped

  # Chat service
  chat-service:
    build:
      context: ..
      dockerfile: services/chat-service/Dockerfile
    ports:
      - "50001:50001"
    volumes:
      - ../services/chat-service/config.yaml:/app/config.yaml:ro
      - chat-data:/app/data
    depends_on:
      - mcp-service
      - qdrant
    networks:
      - agent-network
    restart: unless-stopped

  # Knowledge service
  knowledge-service:
    build:
      context: ..
      dockerfile: services/knowledge-service/Dockerfile
    ports:
      - "50002:50002"
    volumes:
      - ../services/knowledge-service/config.yaml:/app/config.yaml:ro
      - knowledge-data:/app/data
    depends_on:
      - qdrant
      - mongodb
    networks:
      - agent-network
    restart: unless-stopped

  # Memory service
  memory-service:
    build:
      context: ..
      dockerfile: services/memory-service/Dockerfile
    ports:
      - "50003:50003"
    volumes:
      - ../services/memory-service/config.yaml:/app/config.yaml:ro
      - memory-data:/app/data
    depends_on:
      - qdrant
    networks:
      - agent-network
    restart: unless-stopped

  # A2A service - cross-service communication
  a2a-service:
    build:
      context: ..
      dockerfile: services/a2a-service/Dockerfile
    ports:
      - "50004:50004"
    volumes:
      - ../services/a2a-service/config.yaml:/app/config.yaml:ro
      - a2a-data:/app/data
    networks:
      - agent-network
    restart: unless-stopped

  # MCP service - tool protocol service
  mcp-service:
    build:
      context: ..
      dockerfile: services/mcp-service/Dockerfile
    ports:
      - "50005:50005"
    volumes:
      - ../services/mcp-service/config.yaml:/app/config.yaml:ro
      - mcp-data:/app/data
    networks:
      - agent-network
    restart: unless-stopped

  # Agent service - multi-agent orchestration
  agent-service:
    build:
      context: ..
      dockerfile: services/agent-service/Dockerfile
    ports:
      - "50006:50006"
    volumes:
      - ../services/agent-service/config.yaml:/app/config.yaml:ro
      - agent-data:/app/data
      - ../configs/agents:/app/configs/agents:ro
    depends_on:
      - mcp-service
    networks:
      - agent-network
    restart: unless-stopped

  # MCP demo server - validates MCP client connections
  mcp-demo-server:
    build:
      context: ..
      dockerfile: services/mcp-demo-server/Dockerfile
    ports:
      - "50009:50009"
    networks:
      - agent-network
    restart: unless-stopped

  # Harness service - operational governance
  harness-service:
    build:
      context: ..
      dockerfile: services/harness-service/Dockerfile
    ports:
      - "50007:50007"
    volumes:
      - ../services/harness-service/config.yaml:/app/config.yaml:ro
      - harness-data:/app/data
    networks:
      - agent-network
    restart: unless-stopped

  # Qdrant - vector database
  qdrant:
    image: qdrant/qdrant:latest
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant-data:/qdrant/storage
    networks:
      - agent-network
    restart: unless-stopped

  # MongoDB - document database
  mongodb:
    image: mongo:7
    ports:
      - "27017:27017"
    volumes:
      - mongodb-data:/data/db
    networks:
      - agent-network
    restart: unless-stopped

  # Redis - cache
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    networks:
      - agent-network
    restart: unless-stopped

networks:
  agent-network:
    driver: bridge

volumes:
  chat-data:
  knowledge-data:
  memory-data:
  a2a-data:
  mcp-data:
  agent-data:
  harness-data:
  qdrant-data:
  mongodb-data:
  redis-data:
