worker_processes 1;
pid /run/nginx.pid;
events { worker_connections 1024; }
http {
  # WebSocket upgrade mapping.
  map $http_upgrade $connection_upgrade { default upgrade; '' close; }

  server {
    listen 9222;
    # Proxy to Chrome's loopback-only DevTools (127.0.0.1:9223). Rewrite the
    # Host header to localhost so Chrome's DNS-rebinding protection accepts the
    # request (it rejects Host values that aren't localhost/an IP, which blocks
    # cross-container access via the "chrome" service name).
    location / {
      proxy_pass http://127.0.0.1:9223;
      proxy_set_header Host localhost:9223;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection $connection_upgrade;
      proxy_read_timeout 86400s;
      proxy_send_timeout 86400s;
    }
  }
}
